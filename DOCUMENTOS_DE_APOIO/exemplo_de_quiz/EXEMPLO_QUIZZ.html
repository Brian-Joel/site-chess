<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo - Quiz</title>
    <link rel="stylesheet" href="../../public/css/base/variaveis.css">
    <link rel="stylesheet" href="../../public/css/navbar.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="quiz.js"></script>
</head>

<body onload="onloadEsconder()">
    <header>
        <nav class="navegador">
            <div class="topbar">
                <span class="alinhar-topbar">
                    <img class="logo" src="../../public/assets/imgs/logo-horse.png" alt="Logotipo Xeque-Mate">
                    <p class="logo-titulo">Xeque-Mate</p>
                </span>
                <span class="alinhar-texto-navbar">
                    <a class="links" href="../../public/index.html">Home</a>
                    <a class="links" href="#">O que é xadrez?</a>
                    <a class="links" href="#">Sobre mim</a>
                </span>
                <span class="alinhar-btn-navbar">
                    <button class="btn-topbar" disabled hidden
                        onclick="window.location.href='cadastro.html'">Cadastrar</button>
                    <button class="btn-topbar" disabled hidden
                        onclick="window.location.href='login.html'">Entrar</button>
                </span>
            </div>
        </nav>
    </header>

    <main>
        <div id="pontuacaoEJogo" class="quiz">
            <button class="btn_comecar" id="btnIniciarQuiz" onclick="iniciarQuiz()">INICIAR QUIZ</button>

            <div id="pontuacao" class="placar-pontuacao">
                <div id="pontuacaoDuranteJogo" class="bloco-info">
                    <span>Pergunta 1 de 15 <span id="spanCertas"></span></span>
                </div>
                <div id="infoQuestao" class="bloco-info">
                    <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span>
                        questões.</span>
                </div>
                <span>
                    <canvas id="barra_progressao"></canvas>
                </span>
            </div>

            <div id="jogo" class="caixa-jogo">
                <div id="perguntaDaQuestaoAtual" class="titulo-pergunta">
                    <span id="spanQuestaoExibida"></span>
                </div>

                <div id="infoAlternativas" class="instrucao-opcoes">
                    <span><em>Escolha uma opção dentre as abaixo:</em></span>
                </div>

                <div id="opcoes" class="lista-opcoes">
                    <label for="primeiraOpcao" id="opcao-1" class="cartao-opcao">
                        <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA" />
                        <span class="letra-opcao" aria-hidden="true">A</span>
                        <span class="option" id="labelOpcaoUm"></span>
                    </label>
                    <label for="segundaOpcao" id="opcao-2" class="cartao-opcao">
                        <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB" />
                        <span class="letra-opcao" aria-hidden="true">B</span>
                        <span class="option" id="labelOpcaoDois"></span>
                    </label>
                    <label for="terceiraOpcao" id="opcao-3" class="cartao-opcao">
                        <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC" />
                        <span class="letra-opcao" aria-hidden="true">C</span>
                        <span class="option" id="labelOpcaoTres"></span>
                    </label>
                    <label for="quartaOpcao" id="opcao-4" class="cartao-opcao">
                        <input type="radio" id="quartaOpcao" name="option" class="radio" value="alternativaD" />
                        <span class="letra-opcao" aria-hidden="true">D</span>
                        <span class="option" id="labelOpcaoQuatro"></span>
                    </label>
                </div>

                <div id="botoes" class="grupo-botoes">
                    <button onclick="submeter()" id="btnSubmeter">Submeter resposta</button>
                    <button onclick="avancar()" id="btnProx" disabled>Avançar para próxima questão</button>
                    <!-- <button onclick="finalizar()" id="btnConcluir" disabled>Finalizar Quiz</button> -->
                    <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>Tentar novamente</button>
                </div>
            </div>
        </div>

        <div class="placar-resultado" hidden>
            <div id="pontuacaoDuranteJogo" class="bloco-info">
                <span>Quantidade de acertos: <span id="spanCertas"></span></span>
                <span>Quantidade de erros: <span id="spanErradas"></span></span>
            </div>
            <div id="pontuacaoFinalJogo" class="bloco-info">
                <span id="pontuacaoFinal">Pontuação Final: <span id="spanPontuacaoFinal">***</span></span>
                <span id="msgFinal">***</span>
            </div>
        </div>
    </main>
</body>

</html>
