<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <title>XequeMate | Tempo Real</title>

    <link rel="stylesheet" href="../css/base/variaveis.css">
    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />

    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<!-- <body onload="validarSessao(), exibirAquarios(),  atualizacaoPeriodica()"> -->

<body>
    <header class="navegador">
        <nav class="lateral-bar">
            <span class="alinhar-topbar">
                <img class="logo" src="../assets/imgs/logo-horse.png" alt="Logotipo Xeque-Mate">
                <p class="logo-titulo">Xeque-Mate</p>
            </span>
            <div class="hello">
                <img src="../assets/perfil/peao_pixelart.svg" alt="foto de perfil">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>
            <a href="./index.html"><span class="links">Home</span></a>
            <a href="#"><span class="links">História</span></a>
            <a href="#"><span class="links">Sobre mim</span></a>
            <a href="#"><span class="links">Quiz</span></a>
            <a href="#"><span class="links">Forúm</span></a>
            <span class="alinhar-btn-navbar">
                <button class="btn-topbar" onclick="limparSessao()">Sair</button>

            </span>
        </nav>
    </header>
    <main>

        <div class="dash">
            <div id="alerta">
            </div>
            <div class="area-parametros-alerta">
                <p class="titulo-legenda">
                    Legenda - Parâmetros para Alertas
                </p>
                <div class="parametros-alerta">
                    <div class="item-regua perigo-frio">
                        <p>Perigo</p>
                        <p>&lt;=5°C</p>
                    </div>
                    <div class="item-regua alerta-frio">
                        <p>Alerta</p>
                        <p>&lt;=10°C</p>
                    </div>
                    <div class="item-regua ideal">
                        <p>Ideal</p>
                        <p>20°C</p>
                    </div>
                    <div class="item-regua alerta-quente">
                        <p>Alerta</p>
                        <p>&gt;=22°C</p>
                    </div>
                    <div class="item-regua perigo-quente">
                        <p>Perigo</p>
                        <p>&gt;=23°C</p>
                    </div>
                </div>
            </div>

            <div class="cards" id="cardAquarios">

            </div>

        </div>

        </div>

    </main>
</body>

<script>

    function exibirAquarios() {
        JSON.parse(sessionStorage.AQUARIOS).forEach(item => {
            document.getElementById("cardAquarios").innerHTML += `
                    <div class="card-aquario">
                        <div class="title-aquario">
                            <h1>${item.descricao}</h1>
                        </div>
                        <div class="desc-aquario">
                        <div class="temperatura">
                            <p id="temp_aquario_${item.id}">-°C</p>
                        </div>
                        <div class="cor-alerta" id="card_${item.id}"></div>
                    </div>
                    </div>
                    `
        });
    }

</script>

</html>
