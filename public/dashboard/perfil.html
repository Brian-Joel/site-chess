<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xeque-Mate | Perfil</title>
    <link rel="shortcut icon" href="../assets/icon/iconKnight.ico" type="image/x-icon">

    <script src="../js/sessao.js"></script>
    <script src="../js/perfil.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/base/variaveis.css">
    <link rel="stylesheet" href="../css/base/navbar-lateral.css">
    <link rel="stylesheet" href="../css/perfil.css">
</head>

<body onload="validarSessao(); carregarPerfil()">

    <!-- Navbar -->
    <header class="navegador">
        <nav class="lateral-bar">
            <span class="alinhar-topbar">
                <img class="logo" src="../assets/imgs/logo-horse.png" alt="Logotipo Xeque-Mate">
                <p class="logo-titulo">Xeque-Mate</p>
            </span>

            <div class="hello">
                <img id="b_foto" alt="Foto de perfil">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <a href="./perfil.html"><span class="links">Perfil</span></a>
            <a href="./dashboard.html"><span class="links">Dashboard</span></a>
            <a href="./quiz.html"><span class="links">Quiz</span></a>

            <span class="alinhar-btn-navbar">
                <button class="btn-topbar" onclick="limparSessao()">Sair</button>
            </span>
        </nav>
    </header>

    <!-- Modal de senha -->
    <dialog id="modalSenha">
        <h3>Alterar senha</h3>

        <div class="campo-grupo">
            <label for="ipt_senha">Nova senha</label>
            <input type="password" id="ipt_senha" oninput="validar()">
        </div>

        <div class="campo-grupo">
            <label for="ipt_senha_confirmar">Confirmar nova senha</label>
            <input type="password" id="ipt_senha_confirmar">
        </div>

        <div class="requisitos">
            <p id="senha_status">Status da senha</p>
            <ul>
                <li id="reqCaractere">Pelo menos 8 caracteres</li>
                <li id="reqCaixa">Pelo menos 1 letra maiúscula e 1 minúscula</li>
                <li id="reqNumero">Pelo menos 1 número</li>
            </ul>
        </div>

        <p id="msgSenha" style="color: #ff6b6b; font-size: 13px;"></p>

        <div class="botoes-direita">
            <button type="button" class="btn-cancelar" onclick="fecharModalSenha()">Cancelar</button>
            <button type="button" class="btn-salvar" onclick="alterarSenha()">Atualizar senha</button>
        </div>
    </dialog>
    <dialog id="modalFoto">
        <h3>Escolha uma foto de perfil</h3>

        <div class="avatares">
            <div class="avatar-item" onclick="selecionarAvatar(this)">
                <img src="../assets/perfil/cavalo_lowpoly.svg" alt="Cavalo">
            </div>
            <div class="avatar-item" onclick="selecionarAvatar(this)">
                <img src="../assets/perfil/peao_pixelart.svg" alt="Peão">
            </div>
            <div class="avatar-item" onclick="selecionarAvatar(this)">
                <img src="../assets/perfil/torre_neon.svg" alt="Torre">
            </div>
            <div class="avatar-item" onclick="selecionarAvatar(this)">
                <img src="../assets/perfil/dama_kawaii.svg" alt="Rainha">
            </div>
            <div class="avatar-item" onclick="selecionarAvatar(this)">
                <img src="../assets/perfil/rei_dourado.svg" alt="Rei">
            </div>
            <div class="avatar-item" onclick="selecionarAvatar(this)">
                <img src="../assets/perfil/bispo_nanquim.svg" alt="Bispo">
            </div>
        </div>

        <p id="msgFoto" style="color: #ff6b6b; font-size: 13px;"></p>

        <div class="botoes-direita">
            <button type="button" class="btn-cancelar" onclick="fecharModalFoto()">Cancelar</button>
            <button type="button" class="btn-salvar" onclick="alterarFoto()">Salvar foto</button>
        </div>
    </dialog>
    <!-- Conteúdo principal -->
    <main>
        <section class="perfil">
            <div class="perfil-card">

                <div class="perfil-header">
                    <h2>Editar perfil</h2>
                    <p>Atualize suas informações de conta.</p>
                </div>

                <div class="perfil-corpo">

                    <!-- Coluna esquerda -->
                    <div class="perfil-esquerda">
                        <div class="foto-wrapper">
                            <img id="perfilFoto" src="../assets/perfil/peao_pixelart.svg" alt="Foto de perfil">
                            <button type="button" class="btn-trocar-foto" title="Alterar foto"
                                onclick="abrirModalFoto()">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                                    <path d="m15 5 4 4" />
                                </svg>
                            </button>
                        </div>
                        <h3 id="perfilNome">@usuario</h3>
                    </div>

                    <!-- Coluna direita -->
                    <form class="perfil-form" id="formPerfil">
                        <div class="campo-grupo">
                            <label for="ipt_nome">Nome de usuário:</label>
                            <input type="text" id="ipt_nome" name="nome" placeholder="Seu nome de usuário">
                        </div>

                        <div class="campo-grupo">
                            <label for="ipt_email">E-mail:</label>
                            <input type="email" id="ipt_email" name="email" placeholder="seu@email.com">
                        </div>

                        <div class="campo-grupo">
                            <label>Senha</label>
                            <div class="input-senha-box">
                                <input type="password" value="••••••••" disabled>
                                <button type="button" class="btn-habilitar-senha" onclick="abrirModalSenha()">
                                    Alterar senha
                                </button>
                            </div>
                        </div>
                    </form>

                </div>

                <!-- Rodapé -->
                <div class="perfil-footer">
                    <button type="button" class="btn-excluir" onclick="excluirConta()">Excluir conta</button>

                    <div class="botoes-direita">
                        <button type="button" class="btn-cancelar" onclick="cancelarEdicao()">Cancelar</button>
                        <button type="button" class="btn-salvar" onclick="salvarAlteracoes()">Salvar alterações</button>
                    </div>
                </div>

            </div>
        </section>
    </main>

</body>

</html>
<script>
    var idUsuario = sessionStorage.ID_USUARIO;
    var nomeOriginal = "";
    var emailOriginal = "";
    let statusValidacao = false;

    // salva nome e e-mail
    function salvarAlteracoes() {
        var nome = ipt_nome.value;
        var email = ipt_email.value;

        if (nome != nomeOriginal) {
            fetch(`/usuarios/${idUsuario}/nome`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nome: nome })
            }).then(function (resposta) {
                if (resposta.ok) {
                    nomeOriginal = nome;
                    sessionStorage.NOME_USUARIO = nome;
                    perfilNome.innerHTML = "@" + nome;
                    b_usuario.innerHTML = nome;
                    alert("Nome atualizado!");
                } else {
                    alert("Erro ao atualizar o nome.");
                }
            });
        }

        if (email != emailOriginal) {
            fetch(`/usuarios/${idUsuario}/email`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            }).then(function (resposta) {
                if (resposta.ok) {
                    emailOriginal = email;
                    sessionStorage.EMAIL_USUARIO = email;
                    alert("E-mail atualizado!");
                } else {
                    alert("Erro ao atualizar o e-mail. Ele pode já estar em uso.");
                }
            });
        }
    }

    function cancelarEdicao() {
        ipt_nome.value = nomeOriginal;
        ipt_email.value = emailOriginal;
    }

    // validação de senha (copiada do cadastro.js)
    function validar() {

        let validacao = 0;
        let senha = ipt_senha.value;

        if (senha.length >= 8) {
            validacao++;
            reqCaractere.style.color = "green";
        }
        else {
            reqCaractere.style.color = "white";
        }

        if (senha != senha.toUpperCase() && senha != senha.toLowerCase()) {
            validacao++;
            reqCaixa.style.color = "green";
        }
        else {
            reqCaixa.style.color = "white";
        }

        if (senha.includes('0') || senha.includes('1') || senha.includes('2') || senha.includes('3') || senha.includes('4') || senha.includes('5') || senha.includes('6') || senha.includes('7') || senha.includes('8') || senha.includes('9')) {
            validacao++;
            reqNumero.style.color = "green";
        }
        else {
            reqNumero.style.color = "white";
        }

        if (validacao == 3) {
            senha_status.innerHTML = "🔒 Senha Forte";
            senha_status.style.color = "green";
            statusValidacao = true;
        } else if (validacao == 2) {
            senha_status.innerHTML = "⚠️ Senha Média";
            senha_status.style.color = "orange";
            statusValidacao = false;
        } else {
            senha_status.innerHTML = "❌ Senha Fraca";
            senha_status.style.color = "red";
            statusValidacao = false;
        }
    }

    // modal da senha
    function abrirModalSenha() {
        modalSenha.showModal();
    }

    function fecharModalSenha() {
        ipt_senha.value = "";
        ipt_senha_confirmar.value = "";
        msgSenha.innerHTML = "";
        validar();
        modalSenha.close();
    }

    function alterarSenha() {
        var senha = ipt_senha.value;
        var confirmar = ipt_senha_confirmar.value;

        if (senha == "" || confirmar == "") {
            msgSenha.innerHTML = "Preencha os dois campos.";
        } else if (senha != confirmar) {
            msgSenha.innerHTML = "As senhas não coincidem.";
        } else if (!statusValidacao) {
            msgSenha.innerHTML = "Verifique se todos os requisitos foram cumpridos.";
        } else {
            fetch(`/usuarios/${idUsuario}/senha`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ senha: senha })
            }).then(function (resposta) {
                if (resposta.ok) {
                    fecharModalSenha();
                    alert("Senha atualizada!");
                } else {
                    msgSenha.innerHTML = "Erro ao atualizar a senha.";
                }
            });
        }
    }

    // excluir conta
    function excluirConta() {
        if (!confirm("Tem certeza? Essa ação é permanente e apaga seu histórico do quiz.")) {
            return;
        }

        fetch(`/usuarios/${idUsuario}`, { method: "DELETE" })
            .then(function (resposta) {
                if (resposta.ok) {
                    limparSessao();
                } else {
                    alert("Erro ao excluir a conta.");
                }
            });
    }

    var fotoVar = "";

    function abrirModalFoto() {
        modalFoto.showModal();
    }

    function fecharModalFoto() {
        var avatares = document.querySelectorAll('.avatar-item');

        for (let i = 0; i < avatares.length; i++) {
            avatares[i].classList.remove('selecionado');
        }

        fotoVar = "";
        msgFoto.innerHTML = "";
        modalFoto.close();
    }

    function selecionarAvatar(elementoHtml) {
        var avatares = document.querySelectorAll('.avatar-item');

        for (let i = 0; i < avatares.length; i++) {
            avatares[i].classList.remove('selecionado');
        }

        elementoHtml.classList.add('selecionado');

        var imagem = elementoHtml.querySelector('img').getAttribute('src');
        fotoVar = imagem.split('/').pop();
    }

    function alterarFoto() {
        if (fotoVar == "") {
            msgFoto.innerHTML = "Escolha uma foto.";
            return;
        }

        fetch(`/usuarios/${idUsuario}/foto`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ foto: fotoVar })
        }).then(function (resposta) {
            if (resposta.ok) {
                sessionStorage.FOTO_USUARIO = fotoVar;
                perfilFoto.src = "../assets/perfil/" + fotoVar;
                b_foto.src = "../assets/perfil/" + fotoVar;
                fecharModalFoto();
                alert("Foto atualizada!");
            } else {
                msgFoto.innerHTML = "Erro ao atualizar a foto.";
            }
        });
    }
</script>
