<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xeque-Mate | Login</title>

    <script src="./js/sessao.js"></script>


    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/base/variaveis.css">
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/base/footer.css">

</head>

<body>

    <!--Header-->
    <header>
        <nav class="navegador">
            <div class="topbar">
                <span class="alinhar-topbar">
                    <img class="logo" src="./assets/imgs/logo-horse.png" alt="Logotipo Xeque-Mate">
                    <p class="logo-titulo">Xeque-Mate</p>
                </span>
                <span class="alinhar-texto-navbar">
                    <a class="links" href="./index.html">Home</a>
                    <a class="links" href="#">O que é xadrez?</a>
                    <a class="links" href="#">Sobre mim</a>
                    <a class="links" href="#">Quiz</a>
                </span>
                <span class="alinhar-btn-navbar">
                    <button class="btn-topbar" onclick="window.location.href='cadastro.html'">Cadastrar</button>
                </span>
            </div>
        </nav>
    </header>

    <main>
        <section class="sessao">

            <div class="alinhar-imagem">
                <span class="imagem-login">
                    <p>texto bom</p>
                </span>
            </div>

            <div class="login">
                <div class="alerta_erro">
                    <div class="card_erro" id="cardErro">
                        <span id="mensagem_erro"></span>
                    </div>
                </div>
                <div class="container">
                    <div class="card card-login">
                        <span class="linha">
                            <h2>Login</h2>
                        </span>
                        <div class="formulario">
                            <div class="campo">
                                <span>E-mail:</span>
                                <input id="email_input" type="text" placeholder="Login">
                            </div>
                            <div class="campo">
                                <span>Senha:</span>
                                <input id="senha_input" type="password" placeholder="******">
                            </div>
                            <button class="botao" onclick="entrar()">Entrar</button>
                        </div>

                        <div id="div_aguardar" class="loading-div">
                            <img src="./assets/circle-loading.gif" id="loading-gif">
                        </div>

                        <div id="div_erros_login"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);  
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
