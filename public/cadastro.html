<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Xeque-Mate | Cadastro</title>

  <script src="./js/sessao.js"></script>


  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@400;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/base/variaveis.css">
  <link rel="stylesheet" href="css/base/reset.css">
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/base/footer.css">
</head>

<body onload="listar()">
  <!--header inicio-->
  <header>
    <nav class="navegador">
      <div class="topbar">
        <span class="alinhar-topbar">
          <img class="logo" src="./assets/imgs/logo-horse.png" alt="Logotipo Xeque-Mate">
          <p class="logo-titulo">Xeque-Mate</p>
        </span>
        <span class="alinhar-texto-navbar">
          <a class="links" href="index.html">Home</a>
          <a class="links" href="#">O que é xadrez?</a>
          <a class="links" href="#">Sobre mim</a>
          <a class="links" href="#">Quiz</a>
        </span>
        <span class="alinhar-btn-navbar">
          <button class="btn-topbar" onclick="window.location.href='login.html'">Entrar</button>
        </span>
      </div>
    </nav>
  </header>
  <!--header fim-->
  <main>
    <section class="sessao">
      <div class="alinhar-imagem">
        <span class="imagem-login">
          <p>texto bom</p>
        </span>
      </div>

      <div class="login">
        <div class="alerta_erro">
          <div class="card_erro" id="cardErro">
            <span id="mensagem_erro"></span>
          </div>
        </div>
        <div class="container">
          <div class="card card-cadastro">
            <span class="linha">
              <h2>Cadastre-se</h2>
            </span>
            <div class="formulario">

              <!-- ETAPAS  -->
              <div class="container-etapas">
                <div class="etapa">
                  <span id="etapa-1" class="circulo"><img src="./assets/imgs/peao.png" alt="Peão"></span>
                  <span class="texto-etapa">Abertura</span>
                </div>
                <div class="linha-etapa" id="linha-1"></div>
                <div class="etapa">
                  <span id="etapa-2" class="circulo"><img src="./assets/imgs/peao.png" alt="Cavalo"></span>
                  <span class="texto-etapa">Meio-Jogo</span>
                </div>
                <div class="linha-etapa" id="linha-2"></div>
                <div class="etapa">
                  <span id="etapa-3" class="circulo"><img src="./assets/imgs/peao.png" alt="Rei"></span>
                  <span class="texto-etapa">Final</span>
                </div>
              </div>

              <!-- TELA 1 - CADASTRO USUARIO E LOGIN -->
              <div id="conteudo-etapa-1" class="etapa-formulario ativo">
                <div class="campo">
                  <span>Nome:</span>
                  <input id="nome_input" type="text" placeholder="Seu nome" />
                </div>
                <div class="campo">
                  <span>E-mail:</span>
                  <input id="email_input" type="text" placeholder="usuario@provedor.com" />
                </div>
              </div>

              <!-- TELA 2 - CADASTRAR SENHA -->
              <div id="conteudo-etapa-2" class="etapa-formulario">
                <div class="campo">
                  <span>Senha:</span>
                  <input id="senha_input" type="password" placeholder="******" />
                </div>
                <div class="campo">
                  <span>Confirmação da Senha:</span>
                  <input id="confirmacao_senha_input" type="password" placeholder="******" />
                </div>
                <p class="senha-status">🔒 Senha Forte</p>
                <div class="requisitos">
                  <p>Requisitos Mínimos:</p>
                  <ul>
                    <li>Pelo menos 8 caracteres</li>
                    <li>Pelo menos 1 letra maiúscula</li>
                    <li>Pelo menos 1 número</li>
                  </ul>
                </div>
              </div>

              <!-- TELA 3 - ESCOLHA DAS FOTOS DE PERFIL -->
              <div id="conteudo-etapa-3" class="etapa-formulario">
                <p class="titulo-etapa3">Escolha uma foto de perfil</p>

                <div class="avatares">
                  <!-- Foto dos avatares -->
                  <div class="avatar-item"><img src="avatar-cavalo.png" alt="Cavalo"></div>
                  <div class="avatar-item"><img src="avatar-peao.png" alt="Peão"></div>
                  <div class="avatar-item"><img src="avatar-torre.png" alt="Torre"></div>
                  <div class="avatar-item"><img src="avatar-rainha.png" alt="Rainha"></div>
                  <div class="avatar-item"><img src="avatar-rei.png" alt="Rei"></div>
                  <div class="avatar-item"><img src="avatar-bispo.png" alt="Bispo"></div>
                </div>
              </div>

              <!-- botões para navegação -->
              <div class="botoes-container">
                <button id="btnVoltar" class="botao btn-voltar" onclick="voltar()">Voltar</button>
                <button id="botao" class="botao btn-cadastro" onclick="cadastrar()">Continuar</button>
              </div>

            </div>
            <div id="div_aguardar" class="loading-div">
              <img src="./assets/circle-loading.gif" id="loading-gif" />
            </div>

            <div id="div_erros_login"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaUsuario = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo

    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    // ETAPA 1: valida nome e email e só avança
    if (etapa == 1) {
      if (nomeVar == "" || emailVar == "") {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(ERRO: Preencha o campo nome e email!)";
        setTimeout(sumirMensagem, 5000);
        finalizarAguardar();
        return false;
      }
      avancar();
      return false;
    }

    if (etapa == 2) {
      if (senhaVar == "" || confirmacaoSenhaVar == "") {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(ERRO: Preencha os campos de senha!)";
        setTimeout(sumirMensagem, 5000);
        finalizarAguardar();
        return false;
      }
      else if (senhaVar != confirmacaoSenhaVar) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(ERRO: As senhas são diferentes!)";
        setTimeout(sumirMensagem, 5000);
        finalizarAguardar();
        return false;
      }
      avancar();
    }


    // Validação passou: vai para a última etapa


    // // Verificando se o código de ativação é de alguma usuario cadastrada
    // for (let i = 0; i < listaUsuario.length; i++) {
    //   if (listaUsuario[i] != nomeVar) {
    //     idUsuarioVincular = listaUsuario[i].id
    //     console.log("Nome de usuario válido.");
    //     break;
    //   } else {
    //     cardErro.style.display = "block";
    //     mensagem_erro.innerHTML = "(Mensagem de erro para usuario inválido)";
    //     finalizarAguardar();
    //   }
    // }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
        // idUsuarioVincular: idUsuario
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }

</script>

<script src="./js/cadastro.js"></script>
